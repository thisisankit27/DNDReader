include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - linux/**
    - windows/**
    - android/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - avoid_print
