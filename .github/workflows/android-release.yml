# Signed Android release APKs, built from the repository and CI secrets only.
#
# Run it by hand (Actions -> android-release -> Run workflow) or by pushing a tag `android-v<version>`. It builds
# the split APKs signed with the RELEASE keystore, runs the same gates as android.yml on the arm64 one, verifies
# the signature, and uploads the APKs and their SHA-256 sums as a workflow artifact. It does NOT publish a GitHub
# Release or touch any store: attaching the files is the owner's step (docs/android-release.md).
#
# Secrets (Settings -> Secrets and variables -> Actions); none of them is ever printed or stored in the repo:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64 encoded (`base64 -w0 release.jks`)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the job fails at the first step: it never falls back to the debug key.
name: android-release

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  MAX_APK_BYTES: 25000000

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require the signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::missing the secret for $v (see the header of this workflow)"; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: No local dependency overrides
        run: test ! -e pubspec_overrides.yaml

      - run: flutter pub get

      - name: Fork resolves from the pinned git ref
        run: |
          block=$(sed -n '/^  webview_cef:/,/^  [a-z_]*:$/p' pubspec.lock)
          grep -q 'source: git' <<<"$block"

      # The keystore and key.properties are written outside version control and removed at the end of the job.
      - name: Write the signing material
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build the signed release APKs
        env:
          DNDREADER_REQUIRE_RELEASE_SIGNING: '1'
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols

      - name: Gates on the arm64 APK
        run: |
          .github/scripts/android-check-apk.sh \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$MAX_APK_BYTES"

      - name: Verify the signatures and write checksums
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cd build/app/outputs/flutter-apk
          for apk in app-*-release.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          done
          sha256sum app-*-release.apk | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dndreader-android-release
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS
          retention-days: 30

      - name: Remove the signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"
