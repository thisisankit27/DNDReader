# Signed Android release APKs, built from the repository and CI secrets only.
#
# Run it by hand (Actions -> android-release -> Run workflow) or by pushing a tag `android-v<version>`. It builds
# the split APKs signed with the RELEASE keystore, runs the same gates as android.yml on the arm64 one, verifies
# the signature, and uploads the APKs and their SHA-256 sums as a workflow artifact. It does NOT publish a GitHub
# Release or touch any store: attaching the files is the owner's step (docs/android-release.md).
#
# Secrets (Settings -> Secrets and variables -> Actions); none of them is ever printed or stored in the repo:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64 encoded (`base64 -w0 release.jks`)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the job fails at the first step: it never falls back to the debug key.
name: android-release

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  MAX_APK_BYTES: 25000000

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require the signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::missing the secret for $v (see the header of this workflow)"; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: No local dependency overrides
        run: test ! -e pubspec_overrides.yaml

      - run: flutter pub get

      - name: Fork resolves from the pinned git ref
        run: |
          block=$(sed -n '/^  webview_cef:/,/^  [a-z_]*:$/p' pubspec.lock)
          grep -q 'source: git' <<<"$block"

      # The keystore and key.properties are written outside version control and removed at the end of the job.
      - name: Write the signing material
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build the signed release APKs
        env:
          DNDREADER_REQUIRE_RELEASE_SIGNING: '1'
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols

      - name: Gates on the arm64 APK
        run: |
          .github/scripts/android-check-apk.sh \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$MAX_APK_BYTES"

      # The release certificate's own SHA-256. Not a secret - it is in every copy of the
      # app - but pinning it here is what makes this step meaningful: without it the job
      # only proves an APK is signed by *someone*, not that it carries our key.
      - name: Verify the signatures and write checksums
        env:
          EXPECTED_CERT_SHA256: 90b1f89d69ca9f26140aacc9dcb2a8a5bf494397f1bfe199a126027fa717d936
        run: |
          set -euo pipefail
          apksigner="$(ls "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"/build-tools/*/apksigner \
            | sort -V | tail -1)"
          echo "apksigner: $apksigner"
          cd build/app/outputs/flutter-apk
          ls -l app-*-release.apk
          for apk in app-*-release.apk; do
            echo "--- $apk"
            # Capture rather than pipe: piping into grep swallowed apksigner's output and left
            # grep's exit status as the gate, so a failure here printed nothing at all.
            if ! out="$("$apksigner" verify --print-certs "$apk" 2>&1)"; then
              echo "::error::apksigner could not verify $apk"
              printf '%s\n' "$out"
              exit 1
            fi
            # Always show it. Never be blind again.
            printf '%s\n' "$out" | grep -v '^WARNING' || true
            # build-tools labels this line differently per version - 36 says
            # "Signer #1 certificate SHA-256 digest:", 37 says "V2 Signer: certificate
            # SHA-256 digest:". Matching only the stable tail keeps this working when the
            # runner image bumps its SDK, which is exactly how the 0.3.0 build broke.
            if ! printf '%s\n' "$out" \
              | grep -qiE "certificate SHA-256 digest: *$EXPECTED_CERT_SHA256"; then
              echo "::error::$apk is not signed with the expected release key"
              exit 1
            fi
          done
          sha256sum app-*-release.apk | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dndreader-android-release
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS
          retention-days: 30

      - name: Remove the signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"
