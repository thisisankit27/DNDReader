# Android build gates + the Layer 2 SearchWebView conformance suite on an emulator.
#
# What a green run proves:
#   build   - the release APK builds for arm64 with the size-reduction flags; it contains exactly the expected
#             native libraries (no CEF, no WebView2); every library is 16 KB-page safe; the permissions are
#             INTERNET only; and the file is inside the size budget. Each gate prints what it checked.
#   layer2  - the real MobileSearchWebView (the system WebView of an API 34 emulator image) passes the same
#             conformance suite Linux and Windows pass, against pages served from a loopback HttpServer.
# It does NOT prove touch feel, selection handles, scroll smoothness or memory on real hardware, and it does not
# run on the Moto G60: those are the device passes recorded in docs/progress.md and docs/android-owner-test.md.
# Format, analysis and the unit/widget tests run in ci.yml; they are not repeated here.
#
# There is no continue-on-error anywhere in this file: a failing step fails the job.
name: android

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  # Budget for the arm64 split APK (docs/progress.md, Android budgets): 25 MB, decimal.
  MAX_APK_BYTES: 25000000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # pubspec_overrides.yaml is gitignored and points at a developer's local checkout; CI must resolve the
      # pinned fork, exactly as ci.yml and the desktop workflows do.
      - name: No local dependency overrides
        run: test ! -e pubspec_overrides.yaml

      - run: flutter pub get

      - name: Fork resolves from the pinned git ref
        run: |
          block=$(sed -n '/^  webview_cef:/,/^  [a-z_]*:$/p' pubspec.lock)
          echo "$block"
          grep -q 'source: git' <<<"$block"

      - name: Build the release APK (arm64, obfuscated, split debug info)
        run: >
          flutter build apk --release --split-per-abi --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols

      - name: Gates on the APK
        run: |
          ls -l build/app/outputs/flutter-apk/
          .github/scripts/android-check-apk.sh \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$MAX_APK_BYTES"

      - uses: actions/upload-artifact@v4
        with:
          name: dndreader-android-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

  layer2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: No local dependency overrides
        run: test ! -e pubspec_overrides.yaml

      - run: flutter pub get

      # The emulator needs hardware acceleration; the runner exposes /dev/kvm to its user once this rule is set.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: SearchWebView conformance (Layer 2) on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: flutter test integration_test/search_web_view_conformance_test.dart -d emulator-5554
